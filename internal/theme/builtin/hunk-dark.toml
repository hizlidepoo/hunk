# hunk-dark — the default theme.
#
# Copy this file to ~/.config/hunk/themes/<yourname>.toml and edit it to make
# your own. Every key is optional: anything you leave out keeps its value here.

name = "hunk-dark"

# Syntax highlighting palette: any chroma style name (https://xyproto.github.io/splash/docs/).
syntax = "github-dark"

[ui]
background          = "#1a1b26"
foreground          = "#c0caf5"
border              = "#3b4261"
line_number         = "#565f89"
file_header         = "#7dcfff"
accent              = "#ffcc00"
sidebar_fg          = "#a9b1d6"

[diff]
added_fg        = "#b6ec7a"
added_bg        = "#1d3325"
removed_fg      = "#ff8fa0"
removed_bg      = "#3a1f27"
context_fg      = "#a9b1d6"

# Intra-line emphasis: the words that actually changed on a line, painted a
# shade stronger than the line's own background.
added_word_bg   = "#2f6b38"
removed_word_bg = "#7a2b3c"

# paper — a high-contrast light theme, for terminals with a light background.
#
# Run it with: hunk --theme paper

name = "paper"

[ui]
background          = "#fdfdf7"
foreground          = "#2c2c2c"
border              = "#d4d0c4"
line_number         = "#9a958a"
file_header         = "#0b5f8a"
accent              = "#b5710a"
sidebar_fg          = "#4a4a4a"

[diff]
added_fg        = "#15602a"
added_bg        = "#d4f0d6"
removed_fg      = "#96101f"
removed_bg      = "#fbdadd"
context_fg      = "#3c3c3c"
added_word_bg   = "#9fdca4"
removed_word_bg = "#f3aeb6"

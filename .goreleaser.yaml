# GoReleaser builds, archives, and publishes a release whenever a v* tag is
# pushed. See .github/workflows/release.yml for the trigger.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # install.sh downloads by this exact name, so keep the two in step.
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request

release:
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/wmarquardt/hunk/main/install.sh | sh
    ```
